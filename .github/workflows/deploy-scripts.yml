# The server's settings tools (deploy/app/check_settings.py, deploy/supabase/envfile.py)
# never show a value, so their tests are the only place their output is read whole.
# Ubuntu's own python3-cryptography, the package the server uses. deploy/app/tests
# also runs auto-deploy.sh against made-up repositories (git and flock, as on the server).
name: Deploy scripts

on:
  pull_request:
    paths:
      - 'deploy/**/*.py'
      - 'deploy/**/*.sh'
      - 'deploy/app/.env.example'
      - 'deploy/app/ni-auto-deploy.*'
      # deploy/app/tests reads these two: which containers get which settings, and
      # what the build is handed.
      - 'deploy/app/compose.yaml'
      - 'deploy/app/Dockerfile'
      - '.github/workflows/deploy-scripts.yml'
      # What check_settings.py's proofs copy from the app:
      - 'web/src/lib/crypto/credentials.ts'
      - 'web/src/lib/sms/phone-verification.ts'
      - 'web/src/lib/cloud-browser/viewer-token.ts'
      - 'web/src/lib/calls/caller.ts'
      # deploy/sandbox/tests pins the sandbox image to the app's version of the agent framework:
      - 'web/package.json'

permissions:
  contents: read

jobs:
  tests:
    name: Settings tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s deploy/app/tests -v
      - run: /usr/bin/python3 -m unittest discover -s deploy/supabase/tests -v
      - run: /usr/bin/python3 -m unittest discover -s deploy/sandbox/tests -v
      - run: for f in deploy/app/auto-deploy.sh deploy/app/check-settings.sh deploy/app/pull-settings.sh deploy/supabase/set-secret.sh deploy/livekit/make-keys.sh deploy/livekit/test-token.sh deploy/livekit/test-egress.sh deploy/sandbox/setup.sh deploy/sandbox/check.sh deploy/sandbox/tunnel.sh deploy/server/setup.sh; do bash -n "$f"; done
      - run: sh -n deploy/sandbox/guard.sh
