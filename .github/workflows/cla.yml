# Asks each new contributor to sign CLA.md on their first pull request, and keeps the
# signatures on the cla-signatures branch (create it once; it must not be protected).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # claude: the Co-Authored-By account of commits made with Claude Code. An AI co-author
          # can't sign; the person who opens the pull request signs for their contribution.
          allowlist: liamadsr,claude,bot*
