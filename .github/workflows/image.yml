# The container image for the web app and its eight eve agents (deploy/app): built and
# started on every pull request that touches it, or what decides whether it builds and
# starts: web's dependencies and their patches, next.config.mjs (it mounts the agents),
# the agents, the build scripts the Dockerfile runs, and web/vercel.json (the crontab
# must match it). Nothing is pushed anywhere and no
# secret is used; the smoke test makes up its own values (deploy/app/smoke.sh).
# - Image: builds the one image, starts web, worker, the eight agents and cron with
#   Docker Compose, and checks that each role answers. The run's summary has the
#   build time, the image's size and one line per check.
# - The web test suite is not run here, and the image build does not run it either
#   (`npm run build` does, before `next build`). It is run locally before a push:
#   `npm test` in web/, on Node 24 (web/docs/TESTING.md).
name: Image

on:
  pull_request:
    paths:
      - 'deploy/app/**'
      - '.github/workflows/image.yml'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/packages/ui/package.json'
      - 'web/patches/**'
      - 'web/next.config.*'
      - 'web/agents/**'
      - 'web/scripts/cloud-browser/**'
      - 'web/scripts/copy-ort-runtime.mjs'
      - 'web/vercel.json'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `shell: bash` runs each step with pipefail, so a failed build is not hidden by the
# `tee` after it.
defaults:
  run:
    shell: bash

# Both actions are pinned to the commits the other workflows use
# (actions/checkout v4.4.0, actions/upload-artifact v4.6.2). There is no Node setup
# action: the crontab check needs nothing newer than the runner's own Node.

jobs:
  image:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: deploy/app/smoke/compose.yaml
      NI_APP_IMAGE: ni-app:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check the crontab against web/vercel.json
        run: node deploy/app/cron/generate.mjs --check

      - name: Build the image
        run: |
          started=$SECONDS
          docker compose --progress plain build web 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "BUILD_SECONDS=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Report the build
        run: |
          # BuildKit's plain log: "#12 [build 5/6] RUN ..." names a step and
          # "#12 DONE 52.4s" times it. List the steps that took over five seconds.
          steps="$(awk '
            /^#[0-9]+ \[/ { id = $1; $1 = ""; if (!(id in name)) name[id] = substr($0, 2, 90) }
            /^#[0-9]+ DONE [0-9.]+s/ { t = $3; sub(/s$/, "", t); if (t + 0 >= 5 && ($1 in name)) printf "| %s | %ss |\n", name[$1], t }
          ' "$RUNNER_TEMP/build.log")"
          bytes="$(docker image inspect "$NI_APP_IMAGE" --format '{{.Size}}')"
          # What a registry would hold and a server would pull.
          compressed="$(docker save "$NI_APP_IMAGE" | gzip -1 | wc -c)"
          free="$(df -h --output=avail / | tail -n 1 | tr -d ' ')"
          parts="$(docker run --rm --entrypoint sh "$NI_APP_IMAGE" -c \
            'du -sm /app/web/node_modules /app/web/.next /app/web/agents /app/web/src /app/web/public /usr/local | sed "s/^\([0-9]*\)\t\(.*\)$/| \2 | \1 MB |/"')"
          {
            echo "### Image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Build time, no cache | $((BUILD_SECONDS / 60)) min $((BUILD_SECONDS % 60)) s |"
            echo "| Size, as Docker reports it | $(awk -v b="$bytes" 'BEGIN { printf "%.2f GB", b / 1e9 }') |"
            echo "| Size, saved and gzipped | $(awk -v b="$compressed" 'BEGIN { printf "%.2f GB", b / 1e9 }') |"
            echo "| Runner disk left after the build | $free |"
            echo
            echo "| Build step | Time |"
            echo "|---|---|"
            echo "$steps"
            echo
            echo "| In the image | Size |"
            echo "|---|---|"
            echo "$parts"
            echo
            echo '```'
            grep -E '== eve build:|sandbox:|built in [0-9]+s' "$RUNNER_TEMP/build.log" | sed 's/^#[0-9]* [0-9.]* //' || true
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: deploy/app/smoke.sh

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14
