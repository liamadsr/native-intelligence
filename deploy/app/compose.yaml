# The app on the server: web, worker, the eight eve agents and the scheduler, from
# the one image in this folder, behind the stack's own proxy. The edge Caddy
# (../edge) is the public door: it sends the app's host names to that proxy over the
# shared network ni-edge, and nothing here publishes a port. README.md in this folder
# has what each part does; ../README.md step 20 has how it is set up and switched on.
#
# Run from this folder, as root so the root-only .env can be read:
#   sudo ./deploy.sh              build the image, then roll it out (see deploy.sh)
#   sudo docker compose ps        what is running
#   sudo docker compose logs -f --tail 100 web
#
# The container test is a different stack (smoke/compose.yaml) under another name.
name: ni-app

x-app: &app
  # Built on this server by deploy.sh (`docker compose build web`), never pulled:
  # there is no registry. deploy.sh keeps the image before it as ni-app:previous.
  image: ni-app:live
  pull_policy: never
  # Every setting the app reads, in one root-only file (.env.example lists them).
  # Compose also reads the same file for the ${...} values below.
  env_file:
    - path: .env
      required: true
  # NI_LIVE, in .env, is the one switch between a rehearsal and production. Until it
  # is exactly 1, entrypoint.sh keeps this copy from acting on its own: the scheduler
  # only logs its jobs, and web and worker cannot register the app's functions with
  # Inngest, so nothing can move production's background work onto them. That is
  # what lets the stack run beside the app's current host, on the same database and
  # the same Inngest server, without doing anything twice.
  environment: &app-env
    # The address the app gives Inngest for its functions when it registers: always
    # the public one, whatever Host or scheme a request arrived with.
    INNGEST_SERVE_ORIGIN: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
  # tini as PID 1: passes SIGTERM on and reaps what the servers leave behind.
  init: true
  # An agent and cron write nothing to the image: state is on the volumes below,
  # scratch in /tmp.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  # How long `docker stop` waits after SIGTERM before SIGKILL. This one is the
  # agents'; web, worker and cron set their own below.
  stop_grace_period: 60s
  networks:
    - app

# web and worker are the same server, and `next start` writes into its own folder
# (its cache, the docs index, the pages it regenerates), so they are not read-only.
x-next: &next
  <<: *app
  read_only: false

services:
  # The stack's router (proxy/Caddyfile, the same file the container test uses):
  # /eve/<name>/v1/* straight to that agent, /api/inngest to the worker, the rest to
  # web. The edge Caddy reaches it as ni-app-proxy:8080 on ni-edge.
  proxy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    container_name: ni-app-proxy
    volumes:
      # The folder, not the file: git replaces a file when it updates it, and a
      # single-file mount would keep showing the old one until a restart.
      - ./proxy:/etc/caddy:ro
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app
      - edge

  web:
    <<: *next
    command: [web]
    # next start stops taking requests on SIGTERM and exits once those in flight end.
    stop_grace_period: 120s
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      # Which commit the image was built from (deploy.sh sets it).
      labels:
        org.opencontainers.image.revision: ${NI_APP_COMMIT:-unknown}
        # The public address compiled in: deploy.sh refuses an image built for
        # another one than .env names.
        ni.app-url: ${NEXT_PUBLIC_APP_URL:-}
      args:
        # What `next build` compiles in. All from .env; the build stops when one of
        # the required ones is empty (Dockerfile). NEXT_PUBLIC_APP_URL is the app's
        # public address: a rehearsal builds with its own test address, the switch
        # builds again with production's.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_PROJECT_REF: ${NEXT_PUBLIC_SUPABASE_PROJECT_REF:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-}
        APP_DOWNLOAD_URL_WINDOWS: ${APP_DOWNLOAD_URL_WINDOWS:-}
        # The proxy's inside listener, as this stack's own containers reach it.
        EVE_NEXT_PRODUCTION_ORIGIN: http://proxy:8081
        # The commit, for the build id (Dockerfile). deploy.sh sets it.
        NI_BUILD_ID: ${NI_APP_COMMIT:-}
    deploy:
      resources:
        limits:
          memory: 6g

  # The same server. Only /api/inngest is routed to it (proxy/Caddyfile).
  worker:
    <<: *next
    command: [worker]
    # Inngest steps (600 s) and the longest routes (800 s) finish before it exits.
    stop_grace_period: 900s
    deploy:
      resources:
        limits:
          memory: 6g

  # The scheduler: cron/crontab, generated from web/vercel.json. It calls the web
  # role directly. Until NI_LIVE=1 it only logs each job.
  cron:
    <<: *app
    command: [cron]
    # supercronic waits for running jobs on SIGTERM, and a job holds its call open
    # for up to CRON_TIMEOUT_SECONDS (900 s).
    stop_grace_period: 900s
    environment:
      <<: *app-env
      CRON_TARGET_URL: http://web:3000
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      web:
        condition: service_healthy

  # One container per agent, never more: eve's file store allows one process per
  # agent. Each keeps its workflow runs and its sandbox sessions on volumes; the rest
  # of agents/<name>/.eve is the build's and stays in the image.
  agent-onboarding-researcher:
    <<: *app
    command: [agent, onboarding-researcher]
    volumes:
      - onboarding-researcher-workflow:/app/web/agents/onboarding-researcher/.eve/.workflow-data
      - onboarding-researcher-sandbox:/app/web/agents/onboarding-researcher/.eve/sandbox-cache/just-bash/sessions
    deploy: &agent-limits
      resources:
        limits:
          memory: 3g

  agent-skill-runner:
    <<: *app
    command: [agent, skill-runner]
    volumes:
      - skill-runner-workflow:/app/web/agents/skill-runner/.eve/.workflow-data
      - skill-runner-sandbox:/app/web/agents/skill-runner/.eve/sandbox-cache/just-bash/sessions
    deploy: *agent-limits

  agent-coding-agent:
    <<: *app
    command: [agent, coding-agent]
    volumes:
      - coding-agent-workflow:/app/web/agents/coding-agent/.eve/.workflow-data
      - coding-agent-sandbox:/app/web/agents/coding-agent/.eve/sandbox-cache/just-bash/sessions
    deploy: *agent-limits

  agent-work-agent:
    <<: *app
    command: [agent, work-agent]
    volumes:
      - work-agent-workflow:/app/web/agents/work-agent/.eve/.workflow-data
      - work-agent-sandbox:/app/web/agents/work-agent/.eve/sandbox-cache/just-bash/sessions
    deploy: *agent-limits

  agent-chat-agent:
    <<: *app
    command: [agent, chat-agent]
    volumes:
      - chat-agent-workflow:/app/web/agents/chat-agent/.eve/.workflow-data
      - chat-agent-sandbox:/app/web/agents/chat-agent/.eve/sandbox-cache/just-bash/sessions
    deploy: *agent-limits

  agent-utility:
    <<: *app
    command: [agent, utility]
    volumes:
      - utility-workflow:/app/web/agents/utility/.eve/.workflow-data
      - utility-sandbox:/app/web/agents/utility/.eve/sandbox-cache/just-bash/sessions
    deploy: *agent-limits

  agent-live-agent:
    <<: *app
    command: [agent, live-agent]
    volumes:
      - live-agent-workflow:/app/web/agents/live-agent/.eve/.workflow-data
      - live-agent-sandbox:/app/web/agents/live-agent/.eve/sandbox-cache/just-bash/sessions
    deploy: *agent-limits

  agent-web-research:
    <<: *app
    command: [agent, web-research]
    volumes:
      - web-research-workflow:/app/web/agents/web-research/.eve/.workflow-data
      - web-research-sandbox:/app/web/agents/web-research/.eve/sandbox-cache/just-bash/sessions
    deploy: *agent-limits

# Named here so that they keep their names whatever the project is called, and so
# that the move script and the backup find them: both look for volumes whose names
# start with ni-.
volumes:
  onboarding-researcher-workflow: { name: ni-app-onboarding-researcher-workflow }
  onboarding-researcher-sandbox: { name: ni-app-onboarding-researcher-sandbox }
  skill-runner-workflow: { name: ni-app-skill-runner-workflow }
  skill-runner-sandbox: { name: ni-app-skill-runner-sandbox }
  coding-agent-workflow: { name: ni-app-coding-agent-workflow }
  coding-agent-sandbox: { name: ni-app-coding-agent-sandbox }
  work-agent-workflow: { name: ni-app-work-agent-workflow }
  work-agent-sandbox: { name: ni-app-work-agent-sandbox }
  chat-agent-workflow: { name: ni-app-chat-agent-workflow }
  chat-agent-sandbox: { name: ni-app-chat-agent-sandbox }
  utility-workflow: { name: ni-app-utility-workflow }
  utility-sandbox: { name: ni-app-utility-sandbox }
  live-agent-workflow: { name: ni-app-live-agent-workflow }
  live-agent-sandbox: { name: ni-app-live-agent-sandbox }
  web-research-workflow: { name: ni-app-web-research-workflow }
  web-research-sandbox: { name: ni-app-web-research-sandbox }

networks:
  # The stack's own network: the app's containers and the proxy. It has a way out
  # (the app calls the internet), and nothing else joins it.
  app:
    name: ni-app
  # Created once by hand (../README.md step 7). Only the proxy joins it, so the edge
  # Caddy can reach the proxy and nothing on that network reaches the app's
  # containers directly.
  edge:
    name: ni-edge
    external: true
