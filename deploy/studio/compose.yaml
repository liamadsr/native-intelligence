# The Studio worker (../../studio-worker): does Studio's heavy media work for the app
# (imports, renders with Remotion, stills, thumbnails, slide decks, transcripts). One
# container. README.md in this folder has what it does, how it is started and updated,
# and what it needs from the app.
#
# Nothing calls it: it asks the app for work every 2 s, over the app stack's own
# network (ni-app) at the app's proxy, http://ni-app-proxy:8080, with
# STUDIO_WORKER_SECRET. It publishes no port and listens on none outside its container.
# It holds no database or storage key: it reads and writes files through the links the
# app signs for the job it holds, which point at Storage's public name, reached the way
# the app's own requests out are (ni-app has a way out).
#
# Run from this folder, as root so the root-only .env can be read. The image is built
# with Docker itself, from the repository's root (README.md, "First start"), then:
#   sudo docker compose up -d --no-build
name: ni-studio

services:
  studio-worker:
    build:
      context: ../..
      dockerfile: studio-worker/Dockerfile
    image: ni-studio-worker:local
    pull_policy: never
    container_name: ni-studio-worker
    restart: unless-stopped
    # tini as PID 1: SIGTERM reaches the worker, which lets the running job finish or
    # fails it with a sentence saying why, and reaps what Chrome and FFmpeg leave behind.
    init: true
    environment:
      NODE_ENV: production
      STUDIO_APP_URL: ${STUDIO_APP_URL:-http://ni-app-proxy:8080}
      STUDIO_WORKER_SECRET: ${STUDIO_WORKER_SECRET:?set STUDIO_WORKER_SECRET in .env (the same value as in ../app/.env)}
      # The same name after every restart, so the app's job rows say which worker held them.
      STUDIO_WORKER_ID: studio-worker
      STUDIO_WORKER_KINDS: ${STUDIO_WORKER_KINDS:-}
      STUDIO_WORKER_CONCURRENCY: ${STUDIO_WORKER_CONCURRENCY:-1}
      STUDIO_RENDER_CONCURRENCY: ${STUDIO_RENDER_CONCURRENCY:-2}
      STUDIO_CACHE_BYTES: ${STUDIO_CACHE_BYTES:-5368709120}
      STUDIO_WORK_DIR: /work
      STUDIO_HEALTH_PORT: "9092"
      # How long a running job may still take once the worker is told to stop (well under
      # stop_grace_period below, so the job's failure is sent before Docker kills the process).
      STUDIO_SHUTDOWN_GRACE_MS: "25000"
      # For `transcribe` only. Empty: that kind fails with a sentence saying so.
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # For narration (`voices`, `narration`). Empty: narration is not offered. Generated shots need the
      # higgsfield tool signed in where the worker runs, which this image does not have: off here.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Sound design (earshot). Empty: off. This image does not install earshot yet (studio-worker/README.md, "The image").
      STUDIO_EARSHOT_DIR: ${STUDIO_EARSHOT_DIR:-}
      # Renders run code scenes' code (studio-worker/README.md, "Code scenes"). Empty: off here (production).
      STUDIO_CODE_SCENES: ${STUDIO_CODE_SCENES:-}
    volumes:
      # The asset cache, the render bundle and each job's scratch. Safe to delete while
      # the worker is stopped: it is all made again.
      - studio-work:/work
    # Writes nothing to the image: work on the volume, Chrome's and LibreOffice's
    # scratch in /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=2g
    # Chrome keeps its pages in shared memory; Docker's 64 MB is too little for a render.
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      # The app's proxy, and the way out (Storage's public name, Deepgram, ElevenLabs).
      # It needs no other host: where the firewall allows, limit this container's way
      # out to those (README.md, "What it may reach"). Uploads it opens are fenced in
      # the worker itself (FFmpeg reads local files only; LibreOffice in a locked profile).
      - app
    healthcheck:
      # 200 while its loop runs or a job is running (127.0.0.1 only, inside the container).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9092/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # A job is told to stop after STUDIO_SHUTDOWN_GRACE_MS and ends within seconds; the one thing
    # the worker waits out is a call that is spending on a provider (a narration request, up to
    # two minutes; a generated shot, up to five), so its charge is always reported. An idle or
    # rendering worker still stops in well under a minute.
    stop_grace_period: 6m
    deploy:
      resources:
        limits:
          # A render is Chrome drawing frames and FFmpeg encoding them: as many cores as
          # it is given. Capped so that it cannot take the database's or the app's share
          # of the machine.
          cpus: "4"
          memory: 6g

volumes:
  studio-work:
    name: ni-studio-work

networks:
  # The app stack's own network (../app/compose.yaml), made by that stack: this one
  # joins it and does not own it. Start the app first.
  app:
    name: ni-app
    external: true
