# Postgres memory settings for the Native Intelligence server.
#
# Sized for a 24 GB, 8 vCPU machine that Postgres shares with the rest of
# Supabase, Inngest (its own Postgres and Redis), Caddy and the backup
# container. Postgres is given about a third of the memory, not the usual
# "quarter for shared_buffers on a dedicated database server".
#
# Mounted by ../compose.override.yaml into the folder the Supabase Postgres 17
# image reads at start (/etc/postgresql-custom/conf.d/). To change a value:
# edit it here, then from stack/
#   sudo docker compose restart db        shared_buffers needs a restart
# and check it with
#   sudo docker compose exec db psql -U postgres -c 'show shared_buffers'

# Postgres's own cache. The database is under 1 GB today, so all of it stays
# in memory with a lot of room to grow.
shared_buffers = 4GB

# What the planner may assume is cached in total: shared_buffers plus the
# share of the operating system's file cache Postgres can expect on a machine
# it does not have to itself. This allocates nothing.
effective_cache_size = 10GB

# Per sort or hash step, per query. Several can run at once, so this is kept
# modest: 100 busy steps is 1.6 GB.
work_mem = 16MB

# For VACUUM, CREATE INDEX and the restore of a dump. Vector (HNSW) index
# builds are far faster when the index fits in this.
maintenance_work_mem = 1GB

# One autovacuum worker may use this much (there are up to three).
autovacuum_work_mem = 256MB
