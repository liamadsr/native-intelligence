# Everything Native Intelligence changes about Supabase's own compose file.
#
# stack/docker-compose.yml is theirs, byte for byte from a tagged release, and
# is never edited: their update.sh merges new releases into it. This file is
# layered on top of it by the COMPOSE_FILE line in stack/.env:
#
#   COMPOSE_FILE=docker-compose.yml:../compose.override.yaml
#
# Paths in here are relative to stack/ (Compose resolves every path against
# the folder of the first file), so ../ is this folder and ../../../ is the
# repository root.
#
# Run from stack/, as root so the root-only .env can be read:
#   sudo sh run.sh start
#   sudo docker compose config     (the merged result, to check a change)
#
# What this file does, in order:
#   1. names: project ni-supabase, ni-… volumes and networks
#   2. nothing published on the host
#   3. a public listener on the gateway (an allowlist) that Caddy reaches
#      over a network of their own, and no time limit on Storage transfers
#   4. data in named volumes instead of folders inside the checkout
#   5. Postgres memory settings for this server
#   6. image transformation off, and Storage's upload limit (2 GB)
#   7. Auth settings that only exist in the hosted dashboard today
#   8. the stripe-webhook function and its secrets
name: ni-supabase

services:
  # -------------------------------------------------------------------------
  # The gateway (Envoy). Their file publishes it on host port 8000; here it
  # publishes nothing, and it gets a second, public, listener.
  #
  # Port 8000 is their listener and serves everything: the API, Studio (its
  # last route is a catch-all, behind the dashboard password) and /pg/, which
  # runs SQL for anyone holding the service-role key. It is reached only from
  # inside this stack and through the SSH tunnel in ../README.md, which is
  # what the fixed address on the stack's own network is for.
  #
  # Port 80 is ours and is what Caddy (../edge) forwards the Supabase host
  # to. It lets through the API paths and answers 404 for everything else,
  # then hands the request to port 8000 on the loopback. It is a listener in
  # the same Envoy rather than a proxy in front of it so that one program
  # cleans the path and matches it: a separate proxy cleans paths by its own
  # rules, and the gateway's rules differ (it reads "..;" and "..\" as ".."),
  # which is how a request for /auth/v1/..;/..;/pg/ gets past a list of
  # prefixes held anywhere else.
  #
  # How it gets in without editing their files: their entrypoint ends in
  # `exec envoy -c /etc/envoy/envoy.yaml "$@"`, so a `command` here is extra
  # arguments, and --config-yaml is merged into the bootstrap that -c loads.
  # If a release ever stops passing arguments on, port 80 is simply not there
  # and Caddy answers 502: it fails closed.
  #
  # Why port 80: Storage's S3 endpoint only accepts a request signed for the
  # host name in SUPABASE_PUBLIC_URL, and that name has no port in it
  # (storage-api v1.89.12: the same request signed for api-gw, for an address
  # or for name:8000 is refused). The backup container and the migration
  # scripts use that endpoint from inside Docker: they call
  # http://<that host>/storage/v1/s3 with the name pointed at this container's
  # fixed address, and a bare name over http means port 80.
  # -------------------------------------------------------------------------
  api-gw:
    ports: !reset []
    networks:
      default:
        ipv4_address: 172.31.0.10
      # Shared with Caddy and with nothing else. Caddy finds this container
      # on it as ni-supabase-gateway.
      #
      # Not ni-edge, the network Caddy shares with every other stack: both
      # listeners of this container answer on every network it is attached
      # to, so on ni-edge every container there (Inngest today, the app's own
      # processes later) could reach port 8000 with Studio and /pg/ behind
      # the dashboard password alone, and could pass off any address as the
      # client's, because the public listener believes the one proxy in
      # front of it.
      gateway:
        aliases:
          - ni-supabase-gateway
    # Their entrypoint, with one change to the routes it writes: no overall
    # time limit on Storage transfers. ../gateway/entrypoint.sh says why and
    # how. (The `command` below is still handed on to Envoy.)
    entrypoint: ["/bin/sh", "/ni/gateway-entrypoint.sh"]
    volumes:
      - ../gateway/entrypoint.sh:/ni/gateway-entrypoint.sh:ro
    command:
      - --config-yaml
      - |
        static_resources:
          listeners:
            - name: ni_public
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 80
              per_connection_buffer_limit_bytes: 32768
              filter_chains:
                - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                        stat_prefix: ni_public
                        # The same path handling as their listener.
                        normalize_path: true
                        merge_slashes: true
                        path_with_escaped_slashes_action: REJECT_REQUEST
                        common_http_protocol_options:
                          headers_with_underscores_action: REJECT_REQUEST
                        # Caddy is the one proxy in front: take the client
                        # address and scheme from the headers it sets.
                        use_remote_address: true
                        xff_num_trusted_hops: 1
                        upgrade_configs:
                          - upgrade_type: websocket
                        route_config:
                          name: ni_public
                          virtual_hosts:
                            - name: ni_public
                              domains:
                                - '*'
                              routes:
                                # sign-in, sessions, the OAuth callback, email links
                                - match:
                                    prefix: /auth/v1/
                                  route:
                                    cluster: ni_gateway
                                    timeout: 0s
                                # the data API (PostgREST)
                                - match:
                                    prefix: /rest/v1/
                                  route:
                                    cluster: ni_gateway
                                    timeout: 0s
                                # GraphQL (pg_graphql)
                                - match:
                                    path: /graphql/v1
                                  route:
                                    cluster: ni_gateway
                                    timeout: 0s
                                # the Realtime WebSocket and its HTTP API
                                - match:
                                    prefix: /realtime/v1/
                                  route:
                                    cluster: ni_gateway
                                    timeout: 0s
                                # files, resumable uploads, the S3 protocol
                                - match:
                                    prefix: /storage/v1/
                                  route:
                                    cluster: ni_gateway
                                    timeout: 0s
                                # edge functions (the Stripe webhook)
                                - match:
                                    prefix: /functions/v1/
                                  route:
                                    cluster: ni_gateway
                                    timeout: 0s
                                # Studio, /pg/, /mcp and anything else.
                                - match:
                                    prefix: /
                                  direct_response:
                                    status: 404
                        http_filters:
                          - name: envoy.filters.http.router
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          clusters:
            # Their listener, in this same container. `timeout: 0s` above
            # leaves every time limit to the routes on that side: 30 seconds
            # for the data API and Auth, none for Storage (the entrypoint
            # above), and their own longer ones for functions.
            - name: ni_gateway
              type: STATIC
              connect_timeout: 5s
              load_assignment:
                cluster_name: ni_gateway
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: 127.0.0.1
                              port_value: 8000
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 30000
                    max_pending_requests: 30000
                    max_requests: 30000

  # -------------------------------------------------------------------------
  # Postgres
  # -------------------------------------------------------------------------
  db:
    volumes:
      # The data directory, in a named volume. (Their file keeps it in
      # stack/volumes/db/data; same mount point, so this replaces that.)
      - db-data:/var/lib/postgresql/data
      # Memory settings for this server. The Postgres 17 image reads every
      # .conf file in this folder at start.
      - ../postgres/ni-memory.conf:/etc/postgresql-custom/conf.d/ni-memory.conf:ro
    # Docker's default /dev/shm is 64 MB, which a parallel query or a large
    # vector index build can outgrow.
    shm_size: 1gb
    stop_grace_period: 2m

  # The pooler. Their file publishes it on host ports 5432 and 6543; nothing
  # outside Docker connects to Postgres here (the app uses the HTTP API
  # only), so it publishes nothing. From the server itself it is reachable
  # at the fixed address below, which is what ../README.md and migrate/ use.
  supavisor:
    ports: !reset []
    networks:
      default:
        ipv4_address: 172.31.0.20

  # -------------------------------------------------------------------------
  # Storage: files in a named volume, image transformation off (the app
  # resizes nothing through Storage), so imgproxy does not run.
  #
  # The largest file Storage takes, 2 GB instead of their file's 50 MB. Storage
  # takes the smaller of this and a bucket's own limit, and every bucket has
  # one of its own (web/supabase/migrations/651 gave today's 50 MB to those
  # that had none: apply it BEFORE this, or they would take 2 GB too). So
  # this lets through only what a bucket was made for: a long call's audio
  # file and Egress's recordings in team-call-recordings (2 GB, 566), and the
  # Studio's 2 GB (620). It reaches Storage only when the container is made
  # again (`sudo sh run.sh recreate storage`, ../README.md step 23, "Call
  # audio files"). Nothing in front of Storage caps a body: Caddy sets no
  # request_body limit, and the gateway (Envoy) streams it, with no time
  # limit on the Storage route (../gateway/entrypoint.sh).
  # -------------------------------------------------------------------------
  storage:
    depends_on: !override
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"
      FILE_SIZE_LIMIT: "2147483648"
    volumes:
      - storage-data:/var/lib/storage

  imgproxy:
    # Never started: no service depends on it any more, and nothing sets
    # this profile. To bring image transformation back, delete this block
    # and the `storage` overrides for depends_on and ENABLE_IMAGE_TRANSFORMATION.
    profiles: ["image-transformation"]

  # -------------------------------------------------------------------------
  # Auth. Their file passes through the settings every install needs. These
  # are the ones that today live only in the hosted project's dashboard; the
  # values are in stack/.env (see ../.env.example).
  # -------------------------------------------------------------------------
  auth:
    depends_on:
      mail-templates:
        condition: service_started
    environment:
      # Auth limits sign-in and refresh attempts (/token and its neighbours)
      # per client, and takes "the client" from one request header. With none
      # named, which is how their file leaves it, those limits are not
      # applied at all. X-Real-IP is set by Caddy on every request to the
      # address the connection came from, replacing whatever the caller sent
      # (../edge/Caddyfile), and the gateway passes it on untouched.
      GOTRUE_RATE_LIMIT_HEADER: X-Real-IP
      # Google: the web and desktop redirect flow, and sign-in with a Google
      # ID token.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:?set GOOGLE_ENABLED in .env}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      GOTRUE_EXTERNAL_GOOGLE_SKIP_NONCE_CHECK: ${GOOGLE_SKIP_NONCE_CHECK:-false}

      # Apple.
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_ENABLED:?set APPLE_ENABLED in .env}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

      # Before a user is created, Auth asks this Postgres function, which
      # refuses free-mail addresses that nobody invited. The function comes
      # over with the database; this is what makes Auth call it.
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: ${HOOK_BEFORE_USER_CREATED_ENABLED:?set HOOK_BEFORE_USER_CREATED_ENABLED in .env}
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/public/hook_require_work_email

      # The five email templates, served by `mail-templates` below from
      # web/supabase/templates. Auth fetches a template by URL; if a fetch
      # fails it falls back to its built-in English default.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://mail-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://mail-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://mail-templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://mail-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://mail-templates/email-change.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: ${MAILER_SUBJECTS_CONFIRMATION:-}
      GOTRUE_MAILER_SUBJECTS_INVITE: ${MAILER_SUBJECTS_INVITE:-}
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: ${MAILER_SUBJECTS_MAGIC_LINK:-}
      GOTRUE_MAILER_SUBJECTS_RECOVERY: ${MAILER_SUBJECTS_RECOVERY:-}
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: ${MAILER_SUBJECTS_EMAIL_CHANGE:-}

  # Serves the email templates to Auth, which only reads them over HTTP. The
  # folder is the app's own (web/supabase/templates), so there is one copy of
  # each template; the server's checkout includes that folder (../README.md).
  mail-templates:
    image: caddy:2.11-alpine
    container_name: ni-supabase-mail-templates
    restart: unless-stopped
    command: ["caddy", "file-server", "--root", "/templates", "--listen", ":80"]
    volumes:
      - ../../../web/supabase/templates:/templates:ro

  # -------------------------------------------------------------------------
  # Edge functions. One function moves: stripe-webhook, mounted read-only
  # from the app's own folder next to their main worker and hello function.
  # Stripe calls it without a Supabase token, so FUNCTIONS_VERIFY_JWT must be
  # false in .env (the function checks Stripe's signature itself).
  # -------------------------------------------------------------------------
  functions:
    volumes:
      - ../../../web/supabase/functions/stripe-webhook:/home/deno/functions/stripe-webhook:ro
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

volumes:
  # Their two named volumes, given fixed names.
  db-config:
    name: ni-supabase-db-config
  deno-cache:
    name: ni-supabase-deno-cache
  # Ours: the database and the stored files.
  db-data:
    name: ni-supabase-db
  storage-data:
    name: ni-supabase-storage

networks:
  # The stack's own network. The gateway and the pooler have fixed addresses
  # in it, reachable from the server itself and from nowhere else. Every other
  # container gets its address from the upper half only (ip_range), so none
  # can be handed .10 or .20 while their owner is restarting: without that,
  # `run.sh restart` fails now and then with "Address already in use".
  # The backup container (../backup) joins this network by name.
  default:
    name: ni-supabase
    ipam:
      config:
        - subnet: 172.31.0.0/24
          ip_range: 172.31.0.128/25
  # Caddy and the gateway, and nothing else. Created once by hand (see
  # ../README.md) so that neither stack owns it; ../edge joins it through
  # its compose.supabase.yaml.
  gateway:
    name: ni-supabase-edge
    external: true
