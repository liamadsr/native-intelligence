[package]
name = "browser-exit"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Mac exit for the agent's cloud browser (dial8-website docs/plans/cloud-browser.md, C4)"

# Its own crate so its tests build in seconds, without the app:
#   cargo test --manifest-path src-tauri/crates/browser-exit/Cargo.toml
# Everything here but tokio-tungstenite and tungstenite is already in the app's tree.
[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
# WebSocket framing only; TLS is tokio-rustls with the ring provider, as reqwest's. MIT.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"

# This machine's own networks on Windows (policy::local_networks): IP Helper's
# GetAdaptersAddresses. Already in the app's tree (tokio, socket2). MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
