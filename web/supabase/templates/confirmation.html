<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 40px 20px;">
  <h2 style="margin: 0 0 16px;">Confirm your email</h2>
  <p style="color: #555; line-height: 1.6;">Confirm your email to finish creating your Native Intelligence account.</p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&redirect_to={{ .RedirectTo }}" style="display: inline-block; margin: 24px 0; padding: 12px 24px; background: #000; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500;">Confirm email</a>
  <p style="color: #888; font-size: 13px; line-height: 1.5;">If you didn't sign up for Native Intelligence, you can ignore this email.</p>
</div>
