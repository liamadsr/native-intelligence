<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 40px 20px;">
  <h2 style="margin: 0 0 16px;">Reset your password</h2>
  <p style="color: #555; line-height: 1.6;">Use this link to choose a new password for your Dial8 account. It works once.</p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&redirect_to={{ .RedirectTo }}" style="display: inline-block; margin: 24px 0; padding: 12px 24px; background: #000; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500;">Reset password</a>
  <p style="color: #888; font-size: 13px; line-height: 1.5;">If you didn't ask to reset your password, you can ignore this email. Your password won't change.</p>
</div>
